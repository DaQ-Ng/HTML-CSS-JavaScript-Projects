<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="signup-container">
      <div class="icon-container"><i class="far fa-envelope-open"></i></div>
      <h2>Join Our Newsletter</h2>
      <p>Get the latest updates and coding tips straight to your inbox.</p>

      <form>
        <div class="input-group">
          <i class="far fa-envelope"></i>
          <input type="email" required placeholder="Enter your email" />
        </div>
        <button>Subcribe <i class="fas fa-arrow-right"></i></button>
      </form>

      <div class="benefits">
        <p class="benefits-item">
          <i class="fas fa-check"></i>
          Weekly coding tip
        </p>
        <p class="benefits-item">
          <i class="fas fa-check"></i>
          No spam, unsubsribe anytime
        </p>
      </div>
    </div>
  </body>
</html>
